packages:
  - 'apps/*'
  - 'mcps/*'
  - 'packages/*'

allowBuilds:
  argon2: true
  core-js-pure: true
  esbuild: true
  workerd: true

overrides:
  body-parser: 2.4.0
  fast-uri@3: 3.1.9
  ip-address: 10.7.5
  qs: 6.17.0

minimumReleaseAgeExclude:
  - agents@0.31.0
  - '@cloudflare/workers-types@5.20261028.1'
  - miniflare@5.20261023.1-beta
  - wrangler@4.154.0
